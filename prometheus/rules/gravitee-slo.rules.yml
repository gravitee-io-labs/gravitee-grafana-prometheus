# Gateway-wide availability SLI and error-budget burn rates.
# Objective: 99.5% of API calls are non-5xx over 30 days  ->  error budget = 0.005.
# API traffic only: local=~".*:8082" excludes the internal API (:18082) that Prometheus scrapes.
groups:
  - name: gravitee-slo-sli
    interval: 30s
    rules:
      - record: gravitee:http_requests:rate5m
        expr: sum(rate(http_server_requests_total{local=~".*:8082"}[5m]))
      - record: gravitee:http_errors_5xx:rate5m
        expr: sum(rate(http_server_requests_total{local=~".*:8082", code=~"5.."}[5m])) or vector(0)

      - record: gravitee:sli_availability:ratio_rate5m
        expr: 1 - (sum(rate(http_server_requests_total{local=~".*:8082", code=~"5.."}[5m])) or vector(0)) / sum(rate(http_server_requests_total{local=~".*:8082"}[5m]))
      - record: gravitee:sli_availability:ratio_rate30m
        expr: 1 - (sum(rate(http_server_requests_total{local=~".*:8082", code=~"5.."}[30m])) or vector(0)) / sum(rate(http_server_requests_total{local=~".*:8082"}[30m]))
      - record: gravitee:sli_availability:ratio_rate1h
        expr: 1 - (sum(rate(http_server_requests_total{local=~".*:8082", code=~"5.."}[1h])) or vector(0)) / sum(rate(http_server_requests_total{local=~".*:8082"}[1h]))
      - record: gravitee:sli_availability:ratio_rate6h
        expr: 1 - (sum(rate(http_server_requests_total{local=~".*:8082", code=~"5.."}[6h])) or vector(0)) / sum(rate(http_server_requests_total{local=~".*:8082"}[6h]))
      - record: gravitee:sli_availability:ratio_rate30d
        expr: 1 - (sum(increase(http_server_requests_total{local=~".*:8082", code=~"5.."}[30d])) or vector(0)) / sum(increase(http_server_requests_total{local=~".*:8082"}[30d]))

  - name: gravitee-slo-burn
    interval: 30s
    rules:
      - record: gravitee:error_burn_rate:5m
        expr: (1 - gravitee:sli_availability:ratio_rate5m) / 0.005
      - record: gravitee:error_burn_rate:30m
        expr: (1 - gravitee:sli_availability:ratio_rate30m) / 0.005
      - record: gravitee:error_burn_rate:1h
        expr: (1 - gravitee:sli_availability:ratio_rate1h) / 0.005
      - record: gravitee:error_burn_rate:6h
        expr: (1 - gravitee:sli_availability:ratio_rate6h) / 0.005
      - record: gravitee:error_budget_remaining:ratio30d
        expr: 1 - (1 - gravitee:sli_availability:ratio_rate30d) / 0.005

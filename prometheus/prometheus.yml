global:
  scrape_interval: 5s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'gravitee'
    # Must match GATEWAY_INTERNAL_USER / GATEWAY_INTERNAL_PASSWORD in .env
    basic_auth:
      username: admin
      password: adminadmin
    metrics_path: '/_node/metrics/prometheus'
    static_configs:
      - targets: ['gateway:18082']

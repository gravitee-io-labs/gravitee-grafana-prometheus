# Per-API availability and latency SLIs, and error-budget burn rates, from the metrics the OpenTelemetry
# Collector derives from the Gateway's spans. Objective: 99.5% non-5xx over 30 days (error budget 0.005);
# latency objective: answered within 500 ms. Generated by otel/build.py: edit it there.
groups:
  - name: gravitee-otel-sli
    interval: 30s
    rules:
      - record: gravitee_api:calls:rate5m
        expr: sum by (gravitee_api_name) (rate(gravitee_calls_total{span_kind="SPAN_KIND_SERVER"}[5m]))
      - record: gravitee_api:sli_availability:ratio_rate5m
        expr: 1 - ((sum by (gravitee_api_name) (rate(gravitee_calls_total{span_kind="SPAN_KIND_SERVER", http_status_code=~"5.."}[5m]))) or (sum by (gravitee_api_name) (rate(gravitee_calls_total{span_kind="SPAN_KIND_SERVER"}[5m])) * 0)) / sum by (gravitee_api_name) (rate(gravitee_calls_total{span_kind="SPAN_KIND_SERVER"}[5m]))
      - record: gravitee_api:sli_availability:ratio_rate30m
        expr: 1 - ((sum by (gravitee_api_name) (rate(gravitee_calls_total{span_kind="SPAN_KIND_SERVER", http_status_code=~"5.."}[30m]))) or (sum by (gravitee_api_name) (rate(gravitee_calls_total{span_kind="SPAN_KIND_SERVER"}[30m])) * 0)) / sum by (gravitee_api_name) (rate(gravitee_calls_total{span_kind="SPAN_KIND_SERVER"}[30m]))
      - record: gravitee_api:sli_availability:ratio_rate1h
        expr: 1 - ((sum by (gravitee_api_name) (rate(gravitee_calls_total{span_kind="SPAN_KIND_SERVER", http_status_code=~"5.."}[1h]))) or (sum by (gravitee_api_name) (rate(gravitee_calls_total{span_kind="SPAN_KIND_SERVER"}[1h])) * 0)) / sum by (gravitee_api_name) (rate(gravitee_calls_total{span_kind="SPAN_KIND_SERVER"}[1h]))
      - record: gravitee_api:sli_availability:ratio_rate6h
        expr: 1 - ((sum by (gravitee_api_name) (rate(gravitee_calls_total{span_kind="SPAN_KIND_SERVER", http_status_code=~"5.."}[6h]))) or (sum by (gravitee_api_name) (rate(gravitee_calls_total{span_kind="SPAN_KIND_SERVER"}[6h])) * 0)) / sum by (gravitee_api_name) (rate(gravitee_calls_total{span_kind="SPAN_KIND_SERVER"}[6h]))
      - record: gravitee_api:sli_availability:ratio_rate30d
        expr: 1 - ((sum by (gravitee_api_name) (rate(gravitee_calls_total{span_kind="SPAN_KIND_SERVER", http_status_code=~"5.."}[30d]))) or (sum by (gravitee_api_name) (rate(gravitee_calls_total{span_kind="SPAN_KIND_SERVER"}[30d])) * 0)) / sum by (gravitee_api_name) (rate(gravitee_calls_total{span_kind="SPAN_KIND_SERVER"}[30d]))
      - record: gravitee_api:sli_latency:ratio_rate5m
        expr: sum by (gravitee_api_name) (rate(gravitee_duration_milliseconds_bucket{span_kind="SPAN_KIND_SERVER", le=~"500(\\.0)?"}[5m])) / sum by (gravitee_api_name) (rate(gravitee_duration_milliseconds_count{span_kind="SPAN_KIND_SERVER"}[5m]))
      - record: gravitee_api:sli_latency:ratio_rate1h
        expr: sum by (gravitee_api_name) (rate(gravitee_duration_milliseconds_bucket{span_kind="SPAN_KIND_SERVER", le=~"500(\\.0)?"}[1h])) / sum by (gravitee_api_name) (rate(gravitee_duration_milliseconds_count{span_kind="SPAN_KIND_SERVER"}[1h]))
      - record: gravitee_api:sli_latency:ratio_rate30d
        expr: sum by (gravitee_api_name) (rate(gravitee_duration_milliseconds_bucket{span_kind="SPAN_KIND_SERVER", le=~"500(\\.0)?"}[30d])) / sum by (gravitee_api_name) (rate(gravitee_duration_milliseconds_count{span_kind="SPAN_KIND_SERVER"}[30d]))
      - record: gravitee_otel:calls:rate5m
        expr: sum (rate(gravitee_calls_total{span_kind="SPAN_KIND_SERVER"}[5m]))
      - record: gravitee_otel:sli_availability:ratio_rate5m
        expr: 1 - ((sum (rate(gravitee_calls_total{span_kind="SPAN_KIND_SERVER", http_status_code=~"5.."}[5m]))) or (sum (rate(gravitee_calls_total{span_kind="SPAN_KIND_SERVER"}[5m])) * 0)) / sum (rate(gravitee_calls_total{span_kind="SPAN_KIND_SERVER"}[5m]))
      - record: gravitee_otel:sli_availability:ratio_rate30m
        expr: 1 - ((sum (rate(gravitee_calls_total{span_kind="SPAN_KIND_SERVER", http_status_code=~"5.."}[30m]))) or (sum (rate(gravitee_calls_total{span_kind="SPAN_KIND_SERVER"}[30m])) * 0)) / sum (rate(gravitee_calls_total{span_kind="SPAN_KIND_SERVER"}[30m]))
      - record: gravitee_otel:sli_availability:ratio_rate1h
        expr: 1 - ((sum (rate(gravitee_calls_total{span_kind="SPAN_KIND_SERVER", http_status_code=~"5.."}[1h]))) or (sum (rate(gravitee_calls_total{span_kind="SPAN_KIND_SERVER"}[1h])) * 0)) / sum (rate(gravitee_calls_total{span_kind="SPAN_KIND_SERVER"}[1h]))
      - record: gravitee_otel:sli_availability:ratio_rate6h
        expr: 1 - ((sum (rate(gravitee_calls_total{span_kind="SPAN_KIND_SERVER", http_status_code=~"5.."}[6h]))) or (sum (rate(gravitee_calls_total{span_kind="SPAN_KIND_SERVER"}[6h])) * 0)) / sum (rate(gravitee_calls_total{span_kind="SPAN_KIND_SERVER"}[6h]))
      - record: gravitee_otel:sli_availability:ratio_rate30d
        expr: 1 - ((sum (rate(gravitee_calls_total{span_kind="SPAN_KIND_SERVER", http_status_code=~"5.."}[30d]))) or (sum (rate(gravitee_calls_total{span_kind="SPAN_KIND_SERVER"}[30d])) * 0)) / sum (rate(gravitee_calls_total{span_kind="SPAN_KIND_SERVER"}[30d]))
      - record: gravitee_otel:sli_latency:ratio_rate5m
        expr: sum (rate(gravitee_duration_milliseconds_bucket{span_kind="SPAN_KIND_SERVER", le=~"500(\\.0)?"}[5m])) / sum (rate(gravitee_duration_milliseconds_count{span_kind="SPAN_KIND_SERVER"}[5m]))
      - record: gravitee_otel:sli_latency:ratio_rate1h
        expr: sum (rate(gravitee_duration_milliseconds_bucket{span_kind="SPAN_KIND_SERVER", le=~"500(\\.0)?"}[1h])) / sum (rate(gravitee_duration_milliseconds_count{span_kind="SPAN_KIND_SERVER"}[1h]))
      - record: gravitee_otel:sli_latency:ratio_rate30d
        expr: sum (rate(gravitee_duration_milliseconds_bucket{span_kind="SPAN_KIND_SERVER", le=~"500(\\.0)?"}[30d])) / sum (rate(gravitee_duration_milliseconds_count{span_kind="SPAN_KIND_SERVER"}[30d]))

  - name: gravitee-otel-burn
    interval: 30s
    rules:
      - record: gravitee_api:error_burn_rate:5m
        expr: (1 - gravitee_api:sli_availability:ratio_rate5m) / 0.005
      - record: gravitee_api:error_burn_rate:30m
        expr: (1 - gravitee_api:sli_availability:ratio_rate30m) / 0.005
      - record: gravitee_api:error_burn_rate:1h
        expr: (1 - gravitee_api:sli_availability:ratio_rate1h) / 0.005
      - record: gravitee_api:error_burn_rate:6h
        expr: (1 - gravitee_api:sli_availability:ratio_rate6h) / 0.005
      - record: gravitee_api:error_budget_remaining:ratio30d
        expr: 1 - (1 - gravitee_api:sli_availability:ratio_rate30d) / 0.005
      - record: gravitee_otel:error_burn_rate:5m
        expr: (1 - gravitee_otel:sli_availability:ratio_rate5m) / 0.005
      - record: gravitee_otel:error_burn_rate:30m
        expr: (1 - gravitee_otel:sli_availability:ratio_rate30m) / 0.005
      - record: gravitee_otel:error_burn_rate:1h
        expr: (1 - gravitee_otel:sli_availability:ratio_rate1h) / 0.005
      - record: gravitee_otel:error_burn_rate:6h
        expr: (1 - gravitee_otel:sli_availability:ratio_rate6h) / 0.005
      - record: gravitee_otel:error_budget_remaining:ratio30d
        expr: 1 - (1 - gravitee_otel:sli_availability:ratio_rate30d) / 0.005

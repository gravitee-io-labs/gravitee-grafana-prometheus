apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s
  - name: Gravitee Traces
    uid: gravitee-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: gravitee-loki
        filterByTraceID: true
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
      nodeGraph: { enabled: true }
  # OTel logs hold request and response payloads of logged calls: they can contain personal data. Restrict access.
  - name: Gravitee Call Logs (Loki)
    uid: gravitee-loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: Trace
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: gravitee-tempo
          url: "$${__value.raw}"
          urlDisplayLabel: Open the trace
